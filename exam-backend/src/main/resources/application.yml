server:
  port: 8080

spring:
  application:
    name: exam-backend
  config:
    import: optional:file:./.env.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印 SQL, 上线去掉
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

sa-token:
  token-name: satoken           # token 名称 (请求头)
  timeout: 2592000              # token 有效期 (秒), 默认 30 天
  active-timeout: -1            # 无操作失效时间, -1 不限制
  is-concurrent: true           # 允许同一账号多地登录
  is-share: true                # 多地登录共享同一 token
  token-style: uuid             # token 风格
  is-log: false                 # 是否打印操作日志

# Knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn
